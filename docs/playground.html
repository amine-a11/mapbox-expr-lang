<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mapbox-expr-lang playground</title>
    <meta
      name="description"
      content="Type mapbox-expr-lang source and see the compiled Mapbox GL expression JSON live."
    />
    <style>
      :root {
        --bg: #0d1117;
        --panel: #151b23;
        --border: #2a323c;
        --text: #e6edf3;
        --text-dim: #9aa7b3;
        --accent: #58a6ff;
        --error: #ff7b72;
        --ok: #7ee787;
        --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      header {
        display: flex;
        align-items: baseline;
        gap: 16px;
        flex-wrap: wrap;
        padding: 14px 20px;
        border-bottom: 1px solid var(--border);
      }
      header h1 {
        font-size: 16px;
        margin: 0;
      }
      header nav a {
        color: var(--text-dim);
        text-decoration: none;
        font-size: 13px;
        margin-right: 14px;
      }
      header nav a:hover {
        color: var(--accent);
      }
      .examples {
        margin-left: auto;
        display: flex;
        gap: 6px;
      }
      .examples button {
        background: #1c232c;
        color: var(--text-dim);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 4px 10px;
        font-size: 12px;
        cursor: pointer;
      }
      .examples button:hover {
        color: var(--text);
        border-color: var(--accent);
      }
      main {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1px;
        background: var(--border);
        height: calc(100vh - 53px);
      }
      @media (max-width: 720px) {
        main {
          grid-template-columns: 1fr;
          height: auto;
        }
        #source,
        #output {
          min-height: 45vh;
        }
      }
      .pane {
        background: var(--bg);
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      .pane-label {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px 14px;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--text-dim);
        border-bottom: 1px solid var(--border);
      }
      .pane-label button {
        background: none;
        border: 1px solid var(--border);
        color: var(--text-dim);
        border-radius: 5px;
        padding: 2px 8px;
        font-size: 11px;
        cursor: pointer;
      }
      .pane-label button:hover {
        color: var(--text);
        border-color: var(--accent);
      }
      #source {
        flex: 1;
        resize: none;
        border: none;
        outline: none;
        background: var(--bg);
        color: var(--text);
        font-family: var(--mono);
        font-size: 14px;
        line-height: 1.6;
        padding: 14px;
      }
      #output {
        flex: 1;
        margin: 0;
        padding: 14px;
        overflow: auto;
        font-family: var(--mono);
        font-size: 14px;
        line-height: 1.6;
        white-space: pre-wrap;
        word-break: break-word;
      }
      #output.ok {
        color: var(--ok);
      }
      #output.err {
        color: var(--error);
      }
      #status {
        font-size: 11px;
        color: var(--text-dim);
        padding: 0 14px 10px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>mapbox-expr-lang playground</h1>
      <nav>
        <a href="./">Home</a>
        <a href="guide/">Guide</a>
        <a href="operators/">Operators</a>
        <a href="https://github.com/amine-a11/mapbox-expr-lang">GitHub</a>
      </nav>
      <div class="examples">
        <button data-example="basics">Basics</button>
        <button data-example="match">match</button>
        <button data-example="interpolate">interpolate</button>
      </div>
    </header>
    <main>
      <div class="pane">
        <div class="pane-label"><span>.mel source</span></div>
        <textarea id="source" spellcheck="false"></textarea>
      </div>
      <div class="pane">
        <div class="pane-label">
          <span>compiled JSON</span>
          <button id="copy">Copy</button>
        </div>
        <pre id="output"></pre>
        <div id="status"></div>
      </div>
    </main>

    <script type="module">
      // Loaded from jsdelivr's npm CDN -- works as soon as the package is
      // published (no bundler needed, since dist/index.js is a plain ES
      // module). Until then this import 404s and the page shows a load error.
      import { compile } from "https://cdn.jsdelivr.net/npm/mapbox-expr-lang/dist/index.js";

      const EXAMPLES = {
        basics: `var speed = get("speed")
var type = get("type")

if speed > 80 and type == "highway" then
  "red"
else
  "gray"
`,
        match: `match get("type")
  "motorway", "trunk", "primary" then "red"
  "secondary", "tertiary" then "orange"
  else "gray"
`,
        interpolate: `interpolate linear camera.zoom
  5  then 2
  15 then 20
`,
      };

      const sourceEl = document.getElementById("source");
      const outputEl = document.getElementById("output");
      const statusEl = document.getElementById("status");
      const copyBtn = document.getElementById("copy");

      function run() {
        const source = sourceEl.value;
        try {
          const result = compile(source);
          outputEl.textContent = JSON.stringify(result, null, 2);
          outputEl.className = "ok";
          statusEl.textContent = "";
        } catch (error) {
          outputEl.textContent = error.message;
          outputEl.className = "err";
          statusEl.textContent = "compile() threw -- see message";
        }
      }

      let debounceId;
      sourceEl.addEventListener("input", () => {
        clearTimeout(debounceId);
        debounceId = setTimeout(run, 150);
      });

      document.querySelectorAll("[data-example]").forEach((btn) => {
        btn.addEventListener("click", () => {
          sourceEl.value = EXAMPLES[btn.dataset.example];
          run();
        });
      });

      copyBtn.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(outputEl.textContent);
          copyBtn.textContent = "Copied!";
          setTimeout(() => (copyBtn.textContent = "Copy"), 1000);
        } catch {
          // clipboard API unavailable (e.g. insecure context) -- ignore
        }
      });

      sourceEl.value = EXAMPLES.basics;
      run();
    </script>
  </body>
</html>
